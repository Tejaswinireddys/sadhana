<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sadhana — Calm guided yoga practice</title>
    <meta
      name="description"
      content="Sadhana is a free yoga practice companion with 200+ illustrated poses, guided voice sessions, pathways, kids stories, and profiles for men, women, and pregnancy."
    />
    <meta name="theme-color" content="#0F766E" />

    <!-- Resolve the theme before first paint. Without this, every load renders
         one light frame before React mounts. Keep in sync with ThemeProvider. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("sadhana.theme");
          var pref = saved === "light" || saved === "dark" ? saved : "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* storage blocked — fall back to the stylesheet default */
        }
      })();
    </script>
    <link rel="canonical" href="__PUBLIC_APP_ORIGIN__/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Open Graph / Twitter. og:image is required for a link to render as a
         card at all — without it every share is a blank grey box.
         Hard-coded demo host is rewritten at serve time from PUBLIC_APP_URL. -->
    <meta property="og:title" content="Sadhana — Calm guided yoga practice" />
    <meta
      property="og:description"
      content="Illustrated poses, guided voice, pathways, and kids practice — free and open source."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__PUBLIC_APP_ORIGIN__/" />
    <meta property="og:site_name" content="Sadhana" />
    <meta property="og:image" content="__PUBLIC_APP_ORIGIN__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sadhana — calm guided yoga practice, with an illustrated tree pose."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sadhana — Calm guided yoga practice" />
    <meta
      name="twitter:description"
      content="Illustrated poses, guided voice, pathways, and kids practice — free and open source."
    />
    <meta name="twitter:image" content="__PUBLIC_APP_ORIGIN__/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- No inline onload handler — keeps CSP script-src free of 'unsafe-inline'. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Raleway:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <style>
      #boot-splash {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #0f766e;
        font-family: system-ui, sans-serif;
      }
      html.dark #boot-splash { color: #99f6e4; }
      #boot-splash .boot-brand {
        margin: 0;
        font-family: Lora, Georgia, serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      #boot-splash .boot-spin {
        width: 28px;
        height: 28px;
        border: 3px solid currentColor;
        border-right-color: transparent;
        border-radius: 999px;
        animation: sadhana-boot 0.8s linear infinite;
      }
      /* Slow-load note. Appears only when loading really is slow: a pure-CSS
         fade keeps fast loads clean of it. */
      #boot-splash .boot-slow {
        margin: 0;
        max-width: 22rem;
        padding: 0 1rem;
        text-align: center;
        font-size: 13px;
        opacity: 0;
        animation: sadhana-boot-slow 0.6s ease-in 6s forwards;
      }
      @keyframes sadhana-boot { to { transform: rotate(360deg); } }
      @keyframes sadhana-boot-slow { to { opacity: 0.85; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-spin { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite">
        <p class="boot-brand">Sadhana</p>
        <div class="boot-spin" aria-hidden="true"></div>
        <p style="margin:0;font-size:14px">Loading…</p>
        <p class="boot-slow">Still loading — your practice data is safe. Try refreshing if this takes more than a minute.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
