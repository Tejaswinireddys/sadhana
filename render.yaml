services:
  - type: web
    name: sadhana
    runtime: node
    # Starter keeps the web service warm (no free-tier spin-down) so /healthz
    # and Stripe webhooks stay reachable between practice sessions.
    plan: starter
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: node dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set manually in Render dashboard (Neon connection string)
      - key: PORT
        value: 10000
    healthCheckPath: /healthz
