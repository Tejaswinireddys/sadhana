services:
  # Node web service (not a static site). Express already serves the SPA shell
  # for known client routes (`server/static.ts` → spaPage). Do NOT add a
  # Render "Rewrite /* → /index.html" rule in the dashboard — that pattern is
  # for static sites and would bypass API / media JSON 404 behaviour.
  - type: web
    name: sadhana
    runtime: node
    # Always-on Starter (not free). Free-tier spin-down shows Render's
    # "Application loading" screen to first-time visitors for ~30–50s.
    # Keep this plan so /healthz, Stripe webhooks, and the first Home visit
    # reach the product instead of hosting logs.
    plan: starter
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: node dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set manually in Render dashboard (Neon connection string)
      - key: DEVICE_ID_SECRET
        sync: false # preserve the existing guest-cookie signing key; do not rotate
      - key: PUBLIC_APP_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_PUBLIC_POSTHOG_KEY
        sync: false
      # Web Push. Generate once with `npm run gen:vapid-keys`; without both,
      # production runs with push disabled (it never invents temporary keys).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: BILLING_ENABLED
        value: "false"
      - key: PORT
        value: 10000
    healthCheckPath: /healthz
