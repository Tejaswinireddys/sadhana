name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billing_test
          POSTGRES_PASSWORD: billing_test
          POSTGRES_DB: billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing_test -d billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BILLING_TEST_DATABASE_URL: postgresql://billing_test:billing_test@127.0.0.1:5432/billing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # apt mirrors on ubuntu-latest occasionally fail DNS mid-install; retry a
      # few times so a transient "Temporary failure resolving …" does not red
      # the whole PR before any Playwright tests run.
      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3 4; do
            if npx playwright install chromium --with-deps; then
              exit 0
            fi
            echo "playwright install failed (attempt $attempt); retrying in $((attempt * 15))s…"
            sleep $((attempt * 15))
          done
          echo "playwright install failed after retries"
          exit 1
      - run: npm run test:e2e
        env:
          CI: "true"
